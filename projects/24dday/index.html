function notes(){if(!S.bell)return[];const L=vis(),R=[],mate=S.pp[1];

if(S.nt.mate&&md_)R.push({k:'mate',ic:'check',t:`${mate.n}님이 할 일을 끝냈어요`,b:`'${md_.n}' 완료`,tm:'1시간 전'});

const done1=SG().filter(g=>stS(g)==='dn').pop();
if(S.nt.stg&&done1)R.push({k:'stg',ic:'key',t:`${done1.n}를 모두 마쳤어요`,b:`이제 ${curStg().n}예요. 지금 챙길 일을 확인해 보세요.`,tm:'2일 전'});
return R}

else if(a==='asave'){const nb=Date.parse($('#abs').value);if(nb)S.base=nb;S.addr={from:$('#af').value.trim()||S.addr.from,to:$('#at').value.trim()||S.addr.to};S.type=$('#aty').value;applyType();const pd=$('#apd').value==='1';if(pd!==done(E('c1')))S.ev.forEach(e=>{if(e.st===1)e.dn=pd});S.sh=null;toast('이사 정보를 저장했어요')}
else if(a==='nt'){S.nt[d.k]^=1}
else if(a==='nrd'){S.rd[d.k]=1}
else if(a==='nall'){notes().forEach(n=>S.rd[n.k]=1)}
else if(a==='ntl'){$('#bn').classList.remove('show');S.sh={t:'ntl'}}
else if(a==='gont'){S.pg='my';S.sh=null;setTimeout(()=>{const t=$('#ntc');t&&t.scrollIntoView({block:'start'})},0)}
else if(a==='bell'){S.bell^=1;toast(S.bell?'알림을 켰어요':'알림을 껐어요')}
else if(a==='inv')S.sh={t:'inv'};
else if(a==='share'){const data={title:'24dday 이사 일정',text:'우리 이사 일정을 24dday에서 같이 관리해요',url:LINK};
 if(navigator.share){navigator.share(data).catch(()=>{});return}S.sh=null;toast('메시지 앱으로 초대 링크를 보내요 (시연)')}
else if(a==='copy'){try{navigator.clipboard.writeText(LINK).catch(()=>{})}catch(_){}S.sh=null;toast('초대 링크를 복사했어요')}
else if(a==='chk'){const e=E(d.id),g0=curStg();e.dn=!done(e);if(e.dn){const g1=curStg();if(g1!==g0&&S.bell&&S.nt.stg)setTimeout(()=>banner({ic:'key',t:`${g0.n}를 모두 마쳤어요`,b:`이제 ${g1.n}예요. 다음 할 일이 열렸어요.`}),50);else toast(e.n+' 완료')}}
else if(a==='edit')S.sh={t:'ev',id:d.id};
else if(a==='save'){const e=E(d.id),n=Date.parse($('#ed').value);if(n&&n!==dt(e)){e.f=n;delete e.auto}e.w=$('#ew').value;e.dn=$('#edn').checked;S.sh=null;toast('저장했어요')}
else if(a==='edel')S.sh={t:'edel',id:d.id};
else if(a==='edx'){const e=E(d.id);S.ev=S.ev.filter(x=>x.id!==d.id);S.sh=null;toast(e.n+' 삭제했어요')}
else if(a==='unfix'){delete E(d.id).f;S.sh=null;toast('자동 날짜로 되돌렸어요')}
else if(a==='pedit')S.sh={t:'pl',id:d.id};
else if(a==='psave'){const e=E(d.id),n=Date.parse($('#pd').value);if(n&&n!==dt(e))e.f=n;S.plan[d.id]={bank:$('#pbk').value,amt:$('#pam').value};e.w=$('#pw').value;S.sh=null;toast('입출금 계획을 저장했어요')}
else if(a==='recalc'){document.querySelectorAll('[data-b]').forEach(i=>S.banks[+i.dataset.b]=Math.max(+i.value||0,0));toast('다시 계산했어요')}
else if(a==='pe')S.sh={t:'pe',id:d.id||null};
else if(a==='pc'){S.sh.c=+d.v;document.querySelectorAll('.pk button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));return}
else if(a==='psv'){const x=S.sh,n=$('#pn').value.trim();if(!n)return toast('이름을 적어 주세요');const r=$('#pr')?.value.trim()||'';
 let p=S.pp.find(q=>q.id===x.id);if(p){p.n=n;if(x.id!=='me')p.rel=r;if(x.c)p.c=x.c;S.sh=null;toast('프로필을 저장했어요')}
 else{S.pp.push({id:'p'+Date.now(),n,rel:r,c:x.c||1+(S.pp.length-1)%5});S.sh=null;toast(n+'님을 공유자로 추가했어요')}}
else if(a==='pdel')S.sh={t:'pdel',id:d.id};
else if(a==='pdx'){const p=S.pp.find(q=>q.id===d.id);S.ev.forEach(e=>{if(e.w===d.id)e.w='me'});S.pp=S.pp.filter(q=>q.id!==d.id);S.sh=null;toast(p.n+'님을 삭제했어요')}
else if(a==='doc')S.docs[+d.i][1]^=1;
else if(a==='svc')openSvc(d.k);
else if(a==='qm'){const L=S.q[d.k],i=L.indexOf(d.v);i<0?L.push(d.v):L.splice(i,1);S.qp=1}
else if(a==='qcalc'){S.qp=0;toast('예상 견적을 다시 계산했어요')}
else if(a==='msg')S.sh={t:'msg',v:d.v};
else if(a==='call')S.sh={t:'call',v:d.v};
else if(a==='reg')S.sh={t:'reg'};
else if(a==='regs'){S.sh=null;toast('업체 등록 문의를 보냈어요. 곧 연락드릴게요')}
else if(a==='send'){S.asked=1;S.sh=null;toast('문의를 보냈어요. 답변은 알림으로 알려드려요')}
else if(a==='dial'){S.sh=null;toast('전화 앱으로 연결돼요 (시연)')}
else if(a==='close')S.sh=null;
render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='bs'){const n=Date.parse(e.target.value);if(n){S.base=n;render();toast('직접 정하지 않은 일정이 같이 움직였어요')}}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q){S.q[t.dataset.q]=t.type==='number'?+t.value:t.value}});
render();
</script></body></html>
