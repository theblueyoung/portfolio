<!DOCTYPE html>

      referrerpolicy="no-referrer"

  <body>
    <!-- Navigation bar -->
    <header class="header">
      <!-- Logo -->
      <a href="index.html" class="logo p-h-30"><img src="assets/logo.png" alt="logo" /></a>

      <!-- Hamburger icon -->
      <input class="side-menu" type="checkbox" id="side-menu" />
      <label class="hamb" for="side-menu"
        ><span class="hamb-line"></span
      ></label>

      <!-- Menu -->
      <nav class="nav">
        <ul class="menu">
          <li><a href="about-jeju.html"><span>ABOUT JEJU</span></a></li>

    <main>

          <h1>GALLERY</h1>
          <p>Photos of Jeju</p>
        </div>
      </section>

      <div class="gallery-container">
        <img src="assets/gallery-1.jpeg" alt="cherry blossom">
        <img src="assets/gallery-2.png" alt="people on the beach">
        <img src="assets/gallery-3.jpeg" alt="maple trees">
        <img src="assets/gallery-4.jpeg" alt="snowy mountain">
        <img src="assets/gallery-5.jpeg" alt="golden flowers">
        <img src="assets/gallery-6.jpeg" alt="lava ocean">
        <img src="assets/gallery-7.png" alt="jejuolle route">
        <img src="assets/gallery-8.jpeg" alt="green tea field">
        <img src="assets/gallery-9.jpeg" alt="jejudo hallasan crater lake">

    <!-- Footer -->
    <footer class="p-h-30">
      <a href="#" class="logo"><img src="assets/logo.png" alt="logo" /></a>
      <div class="socials">
        <span>Follow us</span>
        <i class="fa-brands fa-facebook fa-xl"></i>
        <i class="fa-brands fa-instagram fa-xl"></i>
        <i class="fa-brands fa-linkedin fa-xl"></i>
        <i class="fa-brands fa-twitter fa-xl"></i>
