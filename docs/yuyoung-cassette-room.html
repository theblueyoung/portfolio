<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유영 Cassette Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* Concept C: first-person walk. Neon alley (3D corridor) -> shop door -> light room -> cassette wall.
   Pick a tape, it goes into the walkman, the retro TV plays that project (interactive). Lo-fi jazz. */
:root{color-scheme:dark;--ink:#f4efe9;--mute:#9a95ad;--pink:#ff3d8b;--cyan:#3de0ff;--green:#54ff9a;--yel:#ffd23d;--org:#ff7a2f;--bg:#05050c;
--han:'Black Han Sans','Noto Sans KR',sans-serif;--sans:'Noto Sans KR',sans-serif;--mono:'DM Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}

#stage{position:fixed;inset:0}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s}
.scene.on{opacity:1;visibility:visible}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.hud .logo{font-family:var(--han);font-size:22px;letter-spacing:.02em}
.hud .logo{text-shadow:0 0 10px #000a}.hud .logo small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#e6e2f5;margin-top:2px;text-shadow:0 0 8px #000b}
.hud .r{display:flex;gap:10px;align-items:center}
.pillb{border:1px solid #ffffff55;border-radius:99px;padding:6px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:#0008;backdrop-filter:blur(6px);transition:background .2s,color .2s}
.pillb:hover{background:#fff;color:#000}
#hint[data-s=wall]{color:#26356b;text-shadow:0 0 8px #ffffffaa}
#hint[data-s=light]{color:#fff;text-shadow:0 0 10px #8a3a7a}
#hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;text-align:center;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#cfcbe0;text-transform:uppercase;text-shadow:0 0 10px #000}
#walkbtn{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:64px;height:64px;border-radius:50%;border:1px solid #ffffff66;background:#0007;font-size:22px;display:none}
#walkbtn.on{display:block}
#walkbtn:active{background:#fff;color:#000}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#2a0f3a,#05050c 70%);transition:opacity 1s,visibility 1s}
#intro.gone{opacity:0;visibility:hidden}
#intro .box{text-align:center;padding:24px}
#intro h1{font-family:var(--han);font-size:clamp(54px,12vw,150px);line-height:.95;color:var(--pink);text-shadow:0 0 10px var(--pink),0 0 40px #ff3d8baa;animation:flk 4s infinite}
#intro p{margin:18px auto 28px;color:#cfcbe0;max-width:36ch;font-weight:300}
#intro .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bigb{padding:14px 26px;border-radius:99px;border:1.5px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 14px #3de0ff55,inset 0 0 14px #3de0ff22;transition:background .2s,color .2s}
.bigb:hover{background:var(--cyan);color:#000}
.bigb.dim{border-color:#ffffff55;color:#ffffffaa;box-shadow:none}
@keyframes flk{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.5}}

/* ---------- 1. alley (CSS 3D corridor) ---------- */
#alley{background:linear-gradient(#03030a,#0a0516 55%,#1c0b2a)}
#view{position:absolute;inset:0;perspective:700px;perspective-origin:50% 44%;overflow:hidden}
#world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.pl{position:absolute;transform-style:preserve-3d}
#floor{left:-320px;top:250px;width:640px;height:5400px;transform-origin:50% 0;transform:rotateX(-90deg);background:linear-gradient(90deg,#0a0810,#17111f 50%,#0a0810),#0a0810}
#wl,#wr{top:-800px;width:5400px;height:1050px;background:
  repeating-linear-gradient(0deg,transparent 0 46px,#0006 46px 48px),
  repeating-linear-gradient(90deg,transparent 0 150px,#0004 150px 152px),
  linear-gradient(#171020,#0d0912 70%,#0a070d)}
#wl{left:-320px;transform-origin:0 50%;transform:rotateY(90deg)}
#wr{left:-5080px;transform-origin:100% 50%;transform:rotateY(-90deg)}
#endw{left:-320px;top:-800px;width:640px;height:1050px;transform:translateZ(-5400px);background:linear-gradient(#150c20,#0b0712)}
.win{position:absolute;border-radius:2px}
.ac{position:absolute;border-radius:6px;background:#1d1a25;box-shadow:inset 0 0 0 3px #2b2735}
.ac::after{content:"";position:absolute;inset:18%;border-radius:50%;background:repeating-radial-gradient(#0000 0 3px,#3b364a 3px 4px)}
.pipe{position:absolute;width:10px;background:linear-gradient(90deg,#2a2530,#4a4358,#2a2530)}
.sg{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;border:3px solid var(--c);color:var(--c);border-radius:12px;background:#0b0610d0;
  font-family:var(--han);writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.1em;
  text-shadow:0 0 6px var(--c),0 0 18px var(--c),0 0 40px var(--c);box-shadow:0 0 14px var(--c),0 0 50px var(--g),inset 0 0 18px var(--g);animation:sgf var(--d,5s) infinite var(--dl,0s)}
.sg.dbl::before{content:"";position:absolute;inset:6px;border:2px solid var(--c);border-radius:8px;opacity:.9}
@keyframes sgf{0%,17%,19%,64%,66%,100%{opacity:1}18%,65%{opacity:.4}}
.rf{position:absolute;filter:blur(20px);opacity:.38;border-radius:50%}
#endw{transform-style:flat}
#door{position:absolute;left:220px;top:600px;width:200px;height:350px;border-radius:6px 6px 0 0;
  background:linear-gradient(180deg,#58c6ff 0%,#a99cff 45%,#ff7fb8 100%);box-shadow:0 0 60px 20px #7fb8ff88,0 0 160px 80px #ff6fb066;animation:dpulse 4s ease-in-out infinite}
#door::after{content:"";position:absolute;inset:10px;border:2px solid #ffffff88;border-radius:3px}
@keyframes dpulse{50%{filter:brightness(1.18)}}
#haze{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,#ff3d8b22,transparent 55%),linear-gradient(#0000 60%,#0b0618aa)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%)}
#rain{position:absolute;inset:0;pointer-events:none;opacity:.35}

/* ---------- 2. light room ---------- */
#light{background:linear-gradient(#4fb4f2,#6cc8f8 50%,#8fd6fa)}
.lg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:50% 50%;will-change:transform}
.lg i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;border-radius:40px}
.h3{width:74vw;height:40vw;background:#8d8ae8;filter:blur(70px);opacity:.5}
.h2{width:52vw;height:28vw;background:#c77de0;filter:blur(44px);opacity:.6}
.h1{width:38vw;height:20vw;background:#ff6fa9;filter:blur(18px);opacity:.9}
.h0{width:33vw;height:16vw;background:linear-gradient(#ff7fae,#e96fb7);border-radius:30px;box-shadow:inset 0 0 30px #ffd1e6aa;filter:blur(2px)}
#lfloor{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(#0000,#9bd9fb88 40%,#a7dffc);pointer-events:none}

/* ---------- 3. cassette wall ---------- */
#wall{background:radial-gradient(ellipse at 50% 38%,#ff80b0aa,transparent 52%),linear-gradient(#4fb1ee,#79cbf6 62%,#a8def9)}
#wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#0000,#b6e4fb 60%);pointer-events:none}
.panel{position:absolute;left:3vw;right:3vw;top:9vh;height:64vh;border-radius:16px;background:
  repeating-linear-gradient(90deg,#0000 0 7px,#ffffff06 7px 8px),
  linear-gradient(#221a3a,#171229);box-shadow:0 30px 80px #1b1048aa,inset 0 0 0 2px #ffffff14}
.panel::before{content:"";position:absolute;left:4%;right:4%;top:14px;height:3px;background:var(--yel);box-shadow:0 0 12px var(--yel),0 0 30px var(--yel);border-radius:3px}
.tapes{position:absolute;top:9vh;height:64vh;display:grid;gap:1.4vh 1vw;align-content:center;justify-content:center;padding:2vh 0}
#tl{left:4vw;width:22vw;grid-template-columns:repeat(2,1fr)}
#tr{right:4vw;width:22vw;grid-template-columns:repeat(2,1fr)}
.tape{position:relative;aspect-ratio:1.58;width:100%;border-radius:7px;background:#ffffff1c;border:1.5px solid #ffffff55;box-shadow:inset 0 0 10px #ffffff22,0 6px 14px #0006;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .3s,opacity .3s;overflow:hidden;color:#111;cursor:pointer;transform-style:preserve-3d}
.tape.dec{cursor:default;opacity:.62}
.tape .lab{position:absolute;left:7%;right:7%;top:9%;height:44%;border-radius:4px;background:var(--c,#f3e9d2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:clamp(8px,.75vw,11px);font-weight:500;text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.1;padding:2px 4px}
.tape .lab::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:#0003}
.tape .rl{position:absolute;bottom:18%;width:21%;aspect-ratio:1;border-radius:50%;background:#0a0a12;border:2px solid #ffffffaa}
.tape .rl.a{left:20%}.tape .rl.b{right:20%}
.tape .rl::after{content:"";position:absolute;inset:26%;border-radius:50%;background:repeating-conic-gradient(#fff 0 20deg,transparent 20deg 60deg)}
.tape .nib{position:absolute;left:38%;right:38%;bottom:0;height:16%;background:#0003;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.tape.real{opacity:1;box-shadow:inset 0 0 10px #ffffff22,0 6px 14px #0006,0 0 0 1.5px var(--c),0 0 22px var(--c);animation:tglow 2.6s ease-in-out infinite}
@keyframes tglow{50%{box-shadow:inset 0 0 10px #ffffff22,0 6px 14px #0006,0 0 0 1.5px var(--c),0 0 34px var(--c)}}
.tape.real:hover{transform:translateY(-10px) rotateX(-14deg) scale(1.08);z-index:5}
.tape.gone{visibility:hidden}
.slot{position:absolute;inset:0;border-radius:7px;border:1.5px dashed #ffffff33}
.tip{position:fixed;z-index:70;pointer-events:none;background:#000c;border:1px solid #ffffff44;border-radius:8px;padding:6px 10px;font-size:12px;opacity:0;transition:opacity .15s;white-space:nowrap}

/* TV */
#tvw{position:absolute;left:50%;top:11vh;transform:translateX(-50%);width:min(46vw,66vh);z-index:10;transform-origin:50% 50%}
.ant{position:absolute;left:50%;top:-44px;width:0;height:0}
.ant::before,.ant::after{content:"";position:absolute;bottom:0;width:3px;height:70px;background:#ddd;border-radius:3px;transform-origin:bottom}
.ant::before{transform:rotate(-26deg)}.ant::after{transform:rotate(22deg)}
.tvb{position:relative;border-radius:34px;padding:3.2% 3.2% 3.2%;background:linear-gradient(145deg,#4a3d6b,#2b2145 60%,#1c1530);box-shadow:0 26px 60px #12083a99,inset 0 2px 0 #ffffff33,inset 0 -6px 12px #0006;display:grid;grid-template-columns:1fr 10%;gap:3%}
.scr{position:relative;aspect-ratio:4/3;border-radius:34px/28px;overflow:hidden;background:#06060a;box-shadow:inset 0 0 0 3px #000,inset 0 0 40px #000}
.knobs{display:flex;flex-direction:column;align-items:center;gap:14%;padding-top:8%}
.kn{width:64%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ddd,#777 60%,#444);box-shadow:0 3px 6px #0008}
.kn::after{content:"";display:block;width:3px;height:40%;background:#222;margin:6% auto 0;border-radius:2px}
.spk{width:70%;height:22%;margin-top:auto;background:repeating-linear-gradient(0deg,#000 0 2px,#3a2f58 2px 5px);border-radius:4px}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(0deg,#0000 0 2px,#0000002e 2px 3px),
  radial-gradient(ellipse at center,transparent 55%,#000a 100%);mix-blend-mode:multiply;z-index:6}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,#ffffff1c,transparent 30%);z-index:7}
#idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#b9b4d6;font-family:var(--mono);font-size:clamp(10px,1.2vw,15px);letter-spacing:.14em;text-transform:uppercase;text-align:center;background:radial-gradient(#1b1830,#07070d)}
#idle b{font-size:1.9em;font-weight:500;color:var(--cyan);animation:blk 1.2s steps(2) infinite}
@keyframes blk{50%{opacity:.2}}
#prog{position:absolute;inset:0;display:none;background:#0c0b14;color:#eee;container-type:size}
.scr.on #idle{display:none}.scr.on #prog{display:grid}
.scr.boot{animation:boot .5s cubic-bezier(.2,.8,.2,1)}
@keyframes boot{0%{transform:scale(1,.02);filter:brightness(4)}60%{transform:scale(1,1);filter:brightness(2)}100%{filter:none}}
#prog{grid-template-columns:auto 1fr;gap:4cqw;padding:5cqh 4cqw}
.phw{position:relative;height:100%;aspect-ratio:9/18.4;border-radius:3.4cqw;overflow:hidden;background:#000;box-shadow:0 0 0 .8cqw #000,0 0 0 1cqw #4a4560}
.phw iframe,.phw img{position:absolute;left:0;top:0;width:390px;height:800px;border:0;transform-origin:0 0;background:#fff;object-fit:cover;object-position:top}
.inf{min-width:0;overflow:auto;padding-right:1cqw;display:flex;flex-direction:column;gap:2cqh;font-size:3.1cqw;line-height:1.55;scrollbar-width:thin}
.inf .t{font-family:var(--han);font-size:8cqw;line-height:1;color:var(--c,#fff);text-shadow:0 0 12px var(--c)}
.inf .c{font-family:var(--mono);font-size:2.4cqw;letter-spacing:.12em;text-transform:uppercase;color:#a8a3c4}
.inf .o{font-size:3.5cqw;font-weight:500}
.inf dl{display:grid;grid-template-columns:max-content 1fr;gap:1.2cqh 3cqw}
.inf dt{font-family:var(--mono);font-size:2.3cqw;letter-spacing:.1em;text-transform:uppercase;color:var(--c,#ffd23d);padding-top:.3em}
.inf dd{margin:0;color:#e5e1f2}
.inf ul{padding-left:1.1em}
.inf a,.inf button{align-self:flex-start;border:1px solid currentColor;border-radius:99px;padding:.5em 1.1em;font-family:var(--mono);font-size:2.4cqw;letter-spacing:.1em;text-transform:uppercase;color:#fff;text-decoration:none}
.inf a:hover,.inf button:hover{background:#fff;color:#000}
.tvbtn{position:absolute;right:calc(3.2% + 12%);bottom:calc(3.2% + 2%);z-index:12}
#maxb,#ejb{position:absolute;z-index:12;border:1px solid #ffffff66;border-radius:99px;padding:5px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:#000a;display:none}
#maxb{right:calc(12% + 4%);top:calc(3.2% + 10px)}
#tvw.on #maxb{display:block}
#maxb:hover{background:#fff;color:#000}

/* walkman */
#wm{position:absolute;left:50%;bottom:4vh;width:clamp(230px,24vw,340px);transform:translateX(-50%);z-index:12}
.wmb{position:relative;aspect-ratio:1.6;transform:perspective(800px) rotateX(46deg) rotateZ(-5deg);transform-origin:50% 70%;border-radius:14px;background:linear-gradient(#f6c2a6 0 62%,#7ad7cf 62%);box-shadow:0 30px 30px #12084a66,inset 0 3px 0 #ffffff66}
.grille{position:absolute;left:8%;top:9%;width:50%;height:30%;border-radius:6px;background:repeating-linear-gradient(90deg,#c9a4d6 0 5px,#8f6aa6 5px 7px)}
.win2{position:absolute;left:8%;top:44%;width:56%;height:34%;border-radius:6px;background:linear-gradient(#a8b7f5,#8a9be0);box-shadow:inset 0 0 0 4px #c8a8e0}
.win2 .in{position:absolute;inset:14%;border-radius:4px;background:#2a1f4a;display:flex;align-items:center;justify-content:space-around}
.win2 .rr{width:26%;aspect-ratio:1;border-radius:50%;background:#f4f0ff;position:relative}
.win2 .rr::after{content:"";position:absolute;inset:22%;border-radius:50%;background:repeating-conic-gradient(#2a1f4a 0 30deg,#f4f0ff 30deg 90deg)}
#wm.loaded .rr{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win2 .ld{position:absolute;inset:0;border-radius:4px;display:none;background:var(--c);opacity:.88}
#wm.loaded .win2 .ld{display:block;clip-path:inset(30% 4% 24% 4%)}
.keys{position:absolute;left:62%;top:42%;width:34%;height:38%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.keys b{background:linear-gradient(#ffe36a,#f1c21f);border-radius:3px;box-shadow:0 3px 0 #b58f0b}
#wm.loaded .keys b:first-child{transform:translateY(3px);box-shadow:0 0 0 #b58f0b}
.knob{position:absolute;right:9%;top:12%;width:14%;aspect-ratio:1;border-radius:50%;background:#ffd84a;box-shadow:0 3px 0 #b58f0b}
#ejb{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%)}
#wm.loaded #ejb{display:block}
#ejb:hover{background:#fff;color:#000}

/* speakers */
.spkr{position:absolute;bottom:5vh;width:min(12vw,170px);height:min(30vh,300px);border-radius:14px;background:linear-gradient(145deg,#463a66,#1d1633);box-shadow:0 20px 40px #12083a88,inset 0 2px 0 #ffffff22;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:8% 0;z-index:9}
#sl{left:2.5vw}#sr{right:2.5vw}
.cone{width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#3b2f58 0 18%,#120d22 19% 62%,#2a2144 63% 66%,#0c0916 67%);box-shadow:0 0 0 4px #00000066;transform:scale(calc(1 + var(--lv,0)*.12))}
.cone.s{width:42%}

/* maximized TV */
#tvw.max{z-index:40}
#shade{position:absolute;inset:0;background:#000b;z-index:35;opacity:0;visibility:hidden;transition:opacity .4s}
#shade.on{opacity:1;visibility:visible}
#tvw{transition:transform .7s cubic-bezier(.7,0,.2,1)}

/* fly tape + flash */
.fly{position:fixed;z-index:50;pointer-events:none;margin:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45;transition:opacity .6s}
#flash.on{opacity:1;transition:opacity .25s}

/* mobile: TV first, then the walkman, then the tapes (swipe sideways) */
@media(max-width:800px){
  #wall{display:flex;flex-direction:column;align-items:stretch;overflow-y:auto;padding-top:76px;padding-bottom:70px}
  .panel,.spkr{display:none}
  #tvw{position:relative;left:auto;top:auto;transform:none;width:92vw;margin:34px auto 0;order:1;flex:none}
  #wm{position:relative;left:auto;bottom:auto;transform:none;margin:8px auto 14px;order:2;flex:none}
  #tl{order:3}#tr{order:4}
  .tapes{position:static;width:auto!important;height:auto;display:flex;overflow-x:auto;gap:10px;padding:8px 16px;justify-content:flex-start;flex:none}
  .tape{flex:none;width:112px}
  .hud .logo small{display:none}
  .pillb{font-size:10px;padding:5px 10px}
  .inf{font-size:3.7cqw}
  #maxb{right:calc(12% + 2%)}
  #tip{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div class="hud" id="hud" hidden>
  <div class="logo">유영©<small>UX · Interaction Designer</small></div>
  <div class="r"><button class="pillb" id="skip">Skip →</button><button class="pillb" id="snd" aria-pressed="false">♪ Sound Off</button></div>
</div>
<div id="hint"></div>
<button id="walkbtn" aria-label="걷기">↑</button>
<div id="flash"></div>
<div class="tip" id="tip"></div>

<div id="intro">
  <div class="box">
    <h1>유영</h1>
    <p>밤 골목에서 시작해요. 이어폰이나 스피커를 켜고 들어오면 더 좋아요.</p>
    <div class="row"><button class="bigb" id="goSound">♪ 소리 켜고 들어가기</button><button class="bigb dim" id="goQuiet">소리 없이</button></div>
  </div>
</div>

<div id="stage">
  <!-- 1. alley -->
  <section class="scene" id="alley" aria-label="네온 골목">
    <div id="view"><div id="world">
      <div class="pl" id="floor"></div>
      <div class="pl" id="wl"></div>
      <div class="pl" id="wr"></div>
      <div class="pl" id="endw"><div id="door"></div></div>
    </div></div>
    <div id="haze"></div><canvas id="rain"></canvas><div id="vig"></div>

  const f=el.cloneNode(true);f.classList.add('fly');f.classList.remove('real');f.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;--c:${p.c};box-shadow:0 10px 30px #0008`;document.body.appendChild(f);
  el.classList.add('gone');
  const dx=tw.left+tw.width/2-(r.left+r.width/2),dy=tw.top+tw.height/2-(r.top+r.height/2),s=tw.width/r.width*.86;
  const a=f.animate([{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${dx*.4}px,${dy*.4-90}px) scale(1.5) rotate(-10deg)`,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(${s}) rotate(-5deg)`}],{duration:RM?10:900,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});
  a.onfinish=()=>{f.remove();loadedIdx=i;$('#ld').style.setProperty('--c',p.c);$('#ld').style.background=p.c;$('#wm').classList.add('loaded');sfx('play');
    setTimeout(()=>{showTV(i);playTrack(p.k);flying=false},300)}}

function showTV(i){const p=P[i],scr=$('#scr'),pg=$('#prog');
  pg.style.setProperty('--c',p.c);
  const hasProto=!!PROTO[p.k];
  const proto=p.about?'':`<div class="phw" id="phw">${hasProto?`<iframe id="ifr" title="${p.t} 프로토타입" loading="lazy"></iframe>`:`<img src="${COVERS[p.k]}" alt="${p.t} 화면">`}</div>`;
  pg.innerHTML=(p.about?`<div class="phw" style="display:flex;align-items:center;justify-content:center;background:#16122a"><span style="font-family:var(--han);font-size:30cqh;color:${p.c};text-shadow:0 0 24px ${p.c}">유영</span></div>`:proto)+
    `<div class="inf"><div class="c">${p.cat}${!p.about&&!hasProto?' · 화면 캡처':''}</div><div class="t">${p.t}</div><div class="o">${p.one}</div><dl>${p.rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>${p.about?'':`<a href="https://github.com/theblueyoung/${REPO[p.k]}" target="_blank" rel="noopener">GitHub ↗</a>`}</div>`;
  if(!p.about&&hasProto){const fr=$('#ifr');const src=PROTO[p.k];
    if(src&&src.startsWith('srcdoc:')){fr.srcdoc=window.SRCDOC[p.k]}else if(src){fr.src=src}
    fitPhone()}else if(!p.about){fitPhone()}
  scr.classList.add('on','boot');setTimeout(()=>scr.classList.remove('boot'),520);$('#tvw').classList.add('on');$('#maxb').textContent='⤢ 크게 보기';
  $('#hint').textContent='TV 속 화면을 직접 눌러보세요 · 다른 테이프로 바꿔도 돼요'}
function fitPhone(){const w=$('#phw');if(!w)return;const s=w.clientWidth/390;$$('#phw iframe,#phw img').forEach(e=>e.style.transform=`scale(${s})`);const fr=$('#ifr');if(fr){fr.style.height=(w.clientHeight/s)+'px'}}
new ResizeObserver(()=>fitPhone()).observe($('#prog'));
$('#ejb').onclick=()=>{if(maxed)toggleMax();eject(()=>{$('#hint').textContent='테이프를 하나 골라보세요'})};

/* TV: enlarge to play with the prototype */
let maxed=false;
function toggleMax(){const tv=$('#tvw');maxed=!maxed;
  if(maxed){tv.style.transform='translateX(-50%)';const r=tv.getBoundingClientRect();const s=Math.min(innerWidth*.9/r.width,innerHeight*.86/r.height);
    const cx=innerWidth/2,cy=innerHeight/2,tx=cx-(r.left+r.width/2),ty=cy-(r.top+r.height/2);
    tv.classList.add('max');tv.style.transform=`translate(calc(-50% + ${tx}px),${ty}px) scale(${s})`;$('#shade').classList.add('on');$('#maxb').textContent='⤡ 작게'}
  else{tv.style.transform='translateX(-50%)';tv.classList.remove('max');$('#shade').classList.remove('on');$('#maxb').textContent='⤢ 크게 보기'}
  setTimeout(fitPhone,720)}
$('#maxb').onclick=toggleMax;$('#shade').onclick=()=>maxed&&toggleMax();
addEventListener('keydown',e=>{if(e.key==='Escape'&&maxed)toggleMax()});

/* ================= start / skip ================= */
function begin(withSound){$('#intro').classList.add('gone');started=true;$('#hud').hidden=false;show('alley');if(withSound)setSound(true)}
$('#goSound').onclick=()=>begin(true);$('#goQuiet').onclick=()=>begin(false);
$('#snd').onclick=()=>setSound(!on);
$('#skip').onclick=()=>{if(scene==='wall')return;flash(()=>{show('wall');setupWall();$('#light').classList.remove('on');$('#wall').style.opacity='';$('#wall').style.visibility=''})};
</script>
</body>
